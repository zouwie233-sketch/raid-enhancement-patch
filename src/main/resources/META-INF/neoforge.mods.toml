description='''
Independent NeoForge 1.21.1 patch mod for high-difficulty raid enhancement.
Stage 0.9.1.11 persists validated bounded spawn-queue snapshots in existing raid lifecycle metadata. Remaining slots, retry counters, anchors and batch reservations recover after a server restart. Queue limits are available through a clamped server config. Collision, fluid, hazard, support, border and loaded-chunk validation remain authoritative; wave composition and enabled Mixins are unchanged.
'''

